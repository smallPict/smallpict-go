name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # A tag is announced to the module proxy only after the tests pass on the oldest supported Go.
  test:
    name: Test (Go 1.21)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.21"
      - name: Run Tests with Race Detector
        run: go test -race ./...

  index:
    name: 📦 Ping pkg.go.dev Indexing
    needs: test
    runs-on: ubuntu-26.04
    steps:
      - name: Request Go Module Proxy Indexing
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "${VERSION}" ]; then
            VERSION="v0.0.1"
          fi
          echo "Pinging proxy.golang.org for github.com/smallpict/smallpict-go@${VERSION}..."
          curl -s "https://proxy.golang.org/github.com/smallpict/smallpict-go/@v/${VERSION}.info" || true
